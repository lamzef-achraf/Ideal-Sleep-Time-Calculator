<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideal Sleep Time Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🛌 Sleep Time Calculator</h1>
    <p>Select a wake-up time to find out when you should go to bed:</p>

    <label for="wake-time">Wake-up time:</label>
    <input type="time" id="wake-time">

    <button onclick="calculateBedTimes()">Calculate</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
